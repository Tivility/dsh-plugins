packages:
  - packages/*

# Pin the harness line to the release the target profile runs.
#
# `@deepseek-ai/dsh-home-paths` is the cautionary one: its `latest` dist-tag
# still points at 0.0.1-rc.3, which peers on an older `dsh-invariants` line
# than the rest of the harness. A range written from what `npm view … version`
# reports therefore resolves to a version nothing else can live with, and npm
# refuses the whole install with ERESOLVE.
#
# Pin the harness line to the release the target profile runs.
#
# Every published `@deepseek-ai/dsh-*` version is a prerelease, and a semver
# range without an explicit prerelease tag does not match prereleases the way
# it matches releases. So an unmet peer — which pnpm resolves on its own —
# lands on the OLDEST version published rather than the newest.
#
# That is not cosmetic: in `0.0.1-rc.1` the web server's service is named
# `httpServer`, and in `0.1.1-rc.2` it is `webServer`. A package built against
# the wrong one compiles cleanly and then finds no service at runtime.
#
# Direct dependencies do not need pinning here — each manifest states its own
# version. These are the transitively auto-installed peers that drifted.
# `pnpm peers check` is what surfaces a new one; add it here when it appears.
# Scope 0.1.1-rc.2 overrides to 0.1.x packages using pnpm selectors so new 0.2.0 packages can resolve their own peers.
overrides:
  '@tivility/dsh-file-upload>@deepseek-ai/dsh-host-webserver': 0.1.1-rc.2
  '@tivility/dsh-file-viewer>@deepseek-ai/dsh-agent': 0.1.1-rc.2
  '@tivility/dsh-file-viewer>@deepseek-ai/dsh-host-webserver': 0.1.1-rc.2
  '@tivility/dsh-file-viewer>@deepseek-ai/dsh-system-prompt': 0.1.1-rc.2
  '@tivility/dsh-llm-affinity>@deepseek-ai/dsh-llm': 0.1.1-rc.2
  '@tivility/dsh-readonly-auth>@deepseek-ai/dsh-host-webserver': 0.1.1-rc.2
